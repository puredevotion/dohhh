<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, oklch(0.28 0.06 285) 0%, transparent 60%),
        oklch(0.19 0.02 285);
      color: oklch(0.9911 0 0);
      -webkit-font-smoothing: antialiased;
    }
    a { color: oklch(0.6204 0.195 253.83); }
    a:hover { color: oklch(0.72 0.195 253.83); }
    .han { font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 24px; min-height: 796px; box-sizing: border-box">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div style="min-width: 0">
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em">Kantine to play</div>
      <div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: oklch(70.5% 0.015 286.067)">Round 3, first to 46</div>
    </div>
    <div style="flex-shrink: 0; display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px; font-size: 12px; line-height: 16px; font-weight: 500; background: color-mix(in oklab, oklch(0.7329 0.1935 150.81) 12%, transparent); color: color-mix(in oklab, oklch(0.7329 0.1935 150.81) 80%, oklch(0.9911 0 0) 30%)">3 devices</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 9999px; border: 1px solid color-mix(in oklab, oklch(0.68 0.19 296) 60%, transparent); padding: 2px 10px; font-size: 12px; line-height: 16px; font-weight: 500; color: oklch(0.68 0.19 296)">
      Character only
      <span class="mono" style="opacity: 0.8; font-variant-numeric: tabular-nums">+5 / -3</span>
    </span>
    <span class="mono" style="font-size: 14px; font-variant-numeric: tabular-nums; color: oklch(70.5% 0.015 286.067)">41s</span>
  </div>

  <!-- The sign plate. Light, because real signage is light: the thing the
       player must recognise on a station wall is shown the way it is shown
       on a station wall, not restyled into app chrome. -->
  <div style="border-radius: 4px; overflow: hidden; box-shadow: 0 12px 28px -8px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: oklch(0.42 0.13 250); padding: 8px 14px">
      <span class="han" style="font-size: 15px; line-height: 20px; font-weight: 500; color: #fff; letter-spacing: 0.08em">地铁</span>
      <span style="font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.82)">Metro</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 20px; background: #f4f4f2; padding: 34px 20px">
      <span class="han" style="font-size: 84px; line-height: 1; font-weight: 500; color: #14140f; letter-spacing: 0.04em">出口</span>
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#14140f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15"></path>
        <path d="M13 6l6 6-6 6"></path>
      </svg>
    </div>
  </div>

  <div style="font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em">Above a doorway in a subway station. What is it?</div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 8px; border-radius: 12px; border: 1px solid oklch(28% 0.006 286.033); background: oklch(0.2103 0.0059 285.89); padding: 12px 16px; font-size: 14px; line-height: 20px">
      <span class="mono" style="font-size: 12px; color: oklch(70.5% 0.015 286.067)">A</span><span>Ticket office</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; border-radius: 12px; border: 1px solid oklch(28% 0.006 286.033); background: oklch(0.2103 0.0059 285.89); padding: 12px 16px; font-size: 14px; line-height: 20px">
      <span class="mono" style="font-size: 12px; color: oklch(70.5% 0.015 286.067)">B</span><span>Way out</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; border-radius: 12px; border: 1px solid oklch(28% 0.006 286.033); background: oklch(0.2103 0.0059 285.89); padding: 12px 16px; font-size: 14px; line-height: 20px">
      <span class="mono" style="font-size: 12px; color: oklch(70.5% 0.015 286.067)">C</span><span>Emergency stairs</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; border-radius: 12px; border: 1px solid oklch(28% 0.006 286.033); background: oklch(0.2103 0.0059 285.89); padding: 12px 16px; font-size: 14px; line-height: 20px">
      <span class="mono" style="font-size: 12px; color: oklch(70.5% 0.015 286.067)">D</span><span>Platform entrance</span>
    </div>
  </div>

  <div style="text-align: center; font-size: 14px; line-height: 20px; color: oklch(70.5% 0.015 286.067)">Their question. You can see it, so no helping.</div>

</div>
</x-dc>
</body>
</html>
